<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/stats.css" />
  <title>Pickup · 到货统计</title>
</head>
<body>
  <header class="topbar">
    <div class="nav-shell">
      <a class="brand" href="/" aria-label="Pickup 首页">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <span class="brand-name">Pickup</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-sub">到货统计</span>
      </a>
      <div class="top-actions">
        <a class="icon-btn" href="/" aria-label="库存查询" title="库存查询">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
        </a>
        <button id="refreshButton" class="icon-btn" type="button" aria-label="刷新" title="刷新">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01"/><path d="M20.5 3.5v5h-5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="page" class="st" aria-busy="true">
    <div class="st-head">
      <h1>到货统计</h1>
      <div id="productSeg" class="segmented st-product" role="radiogroup" aria-label="机型" hidden></div>
    </div>
    <nav id="days" class="st-days" aria-label="日期"></nav>

    <section id="summary" class="st-summary panel" aria-label="概览"></section>

    <section id="quiet" class="panel quiet" hidden aria-live="polite">
      <div class="quiet-status"><span id="quietDot" class="beacon"></span><span id="quietChecked" class="num"></span></div>
      <h2 id="quietTitle"></h2>
      <dl id="quietFacts" class="quiet-facts"></dl>
      <a id="quietAction" class="quiet-action" href="/" hidden>开启监控</a>
    </section>

    <div id="body" class="st-body">
      <section class="panel st-chart-card" aria-labelledby="chartTitle">
        <header class="st-card-head">
          <h2 id="chartTitle">每小时到货</h2>
          <span id="chartScope" class="st-scope"></span>
        </header>
        <div id="chart" class="st-chart"></div>
      </section>

      <div class="st-split">
        <section class="panel st-configs" aria-labelledby="configTitle">
          <header class="st-card-head">
            <h2 id="configTitle">配置</h2>
            <span id="configCount" class="st-scope num"></span>
          </header>
          <ol id="configs" class="cfg-list"></ol>
          <button id="configsMore" class="st-more" type="button" hidden></button>
        </section>

        <section class="panel st-records" aria-labelledby="recordTitle">
          <header class="st-card-head">
            <h2 id="recordTitle">记录</h2>
            <span id="recordCount" class="st-scope num"></span>
          </header>
          <div class="st-filters">
            <div id="typeSeg" class="segmented compact st-type" role="radiogroup" aria-label="事件">
              <button type="button" data-type="" class="active" aria-checked="true" role="radio">全部</button>
              <button type="button" data-type="up" aria-checked="false" role="radio">到货</button>
              <button type="button" data-type="down" aria-checked="false" role="radio">售罄</button>
            </div>
            <div id="regions" class="st-pills" role="group" aria-label="城市"></div>
          </div>
          <div id="activeFilters" class="st-active"></div>
          <div id="records" class="rec-list"></div>
          <button id="recordsMore" class="st-more" type="button" hidden>更多</button>
        </section>
      </div>
    </div>
  </main>

  <div id="tip" class="st-tip" role="status" aria-live="polite"></div>
  <script type="module" src="/stats.js"></script>
</body>
</html>
